namespace: PyzTest

actor: Tester

include:
    - tests/PyzTest/*/*

paths:
    tests: tests
    output: tests/_output
    data: tests/_data
    support: tests/_support
    envs: tests/_envs

settings:
    colors: true
    memory_limit: 1024M
    log: true
    lint: false

coverage:
    enabled: true
    show_uncovered: true

params:
    - tests/default.yml
    - env
