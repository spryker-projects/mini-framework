version: "1.0"

imports:
    # see config/deploy-templates
    deploy.dev.template.yml:
        parameters:
            namespace: 'app-psp'
            environment: 'psp.spryker.local'
            database: 'psp-docker'

            hosts.backoffice: "psp.spryker.local"
            hosts.glue: "api.psp.spryker.local"
            hosts.scheduler: "scheduler.psp.spryker.local"

            # message bus 2.x
            message_broker.http_sender.base_url: "http://mb2.spryker.local:8080/"
            message_broker.http_receiver.base_url: "http://mb2.spryker.local:8080/"
