namespace: PyzTest\Zed\PaymentProvider

paths:
    tests: .
    data: ../../../_data
    support: _support
    output: ../../../_output

coverage:
    enabled: true
    remote: false
    show_uncovered: true
    whitelist: { include: ['../../../../src/Pyz/*/PaymentProvider/*'] }

suites:
    Business:
        path: Business
        actor: PaymentProviderBusinessTester
        modules:
            enabled:
                - \SprykerTest\Shared\Testify\Helper\Environment
                - \SprykerTest\Shared\AppKernel\Helper\AppConfigHelper
                - \SprykerTest\Shared\AppMerchant\Helper\AppMerchantHelper
                - \SprykerTest\Shared\AppPayment\Helper\AppPaymentHelper
                - \SprykerTest\Shared\Testify\Helper\ConfigHelper
                - \SprykerTest\Shared\Propel\Helper\TransactionHelper
                - \SprykerTest\Zed\Testify\Helper\Business\BusinessHelper
                - \SprykerTest\Shared\Testify\Helper\Environment
                - \SprykerTest\Shared\Testify\Helper\DependencyHelper
                - \SprykerTest\Shared\Testify\Helper\DataCleanupHelper
                - \SprykerTest\Shared\Testify\Helper\ConfigHelper
                - \SprykerTest\Service\Container\Helper\ContainerHelper


    Communication:
        path: Communication
        actor: PaymentProviderCommunicationTester
        modules:
            enabled:
                - Asserts
                - \SprykerTest\Shared\Testify\Helper\Environment
                - \PyzTest\Zed\Testify\Helper\BootstrapHelper
                - \SprykerTest\AsyncApi\AppPayment\Helper\AppPaymentHelper
                - \SprykerTest\Shared\AppKernel\Helper\AppConfigHelper
                - \SprykerTest\Shared\AppMerchant\Helper\AppMerchantHelper
                - \SprykerTest\Shared\AppPayment\Helper\AppPaymentHelper
                - \SprykerTest\Shared\AppPayment\Helper\AppPaymentRefundHelper
                - \SprykerTest\Shared\Testify\Helper\Environment
                - \SprykerTest\Shared\Testify\Helper\DependencyHelper
                - \SprykerTest\Shared\Propel\Helper\TransactionHelper
                - \SprykerTest\Shared\Testify\Helper\ConfigHelper
                - \SprykerTest\Shared\Testify\Helper\DataCleanupHelper
                - \SprykerTest\Zed\Testify\Helper\Business\BusinessHelper
                - \SprykerTest\Zed\Testify\Helper\Communication\DependencyProviderHelper
